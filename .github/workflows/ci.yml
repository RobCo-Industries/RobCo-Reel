name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    # The commit and the image tag must match the RobCo-Core submodule
    # inside Pip-OS, external/pip-os/external/robco-core, and its
    # ci/IMAGE_TAG. `make check-pins` checks both. The reusable workflow
    # checks out with submodules: recursive, which also fetches it.
    uses: RobCo-Industries/RobCo-Core/.github/workflows/robco-ci.yml@712db81c9c804d4a8ede1f866ea764c0c6299844
    with:
      image-tag: ba6372158e4b
      make-targets: all test-host
      test-targets: test-target
      boards: '["raspi0","raspi1ap","raspi2b","raspi3b"]'
      artifact-path: build/samples/hello/HELLO.HTP
